name: Build ScanFlow IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["AutoSplit/**", "project.yml", "scripts/**", "tests/**", ".github/workflows/build.yml"]
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[preview only]') }}
    runs-on: macos-26-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode for Liquid Glass
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import glob, os, re, plistlib
          candidates=glob.glob('/Applications/Xcode*.app')
          def version(path):
              try:
                  with open(path+'/Contents/Info.plist','rb') as stream:
                      label=plistlib.load(stream).get('CFBundleShortVersionString','')
              except (OSError,ValueError):
                  label=os.path.basename(path)
              numbers=re.findall(r'\d+',label)
              return tuple(int(n) for n in numbers) if numbers else (0,)
          modern=[p for p in candidates if (26,)<=version(p)<(27,) and 'beta' not in p.lower()]
          if modern:
              chosen=max(modern,key=version)+'/Contents/Developer'
              with open(os.environ['GITHUB_ENV'],'a') as stream:
                  stream.write('DEVELOPER_DIR='+chosen+'\n')
              print('Using '+chosen)
          else:
              raise SystemExit('::error::Stable Xcode 26 is missing. Use macos-26-intel and the complete workflow from ScanFlow 0.4.2.')
          PYCODE
      - name: Verify Liquid Glass SDK
        run: |
          xcodebuild -version
          python3 - <<'PYCODE'
          import subprocess
          sdk=subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-version'],text=True).strip()
          if int(sdk.split('.')[0])<26:
              raise SystemExit('::error::iOS SDK 26+ required for Liquid Glass. Update the workflow.')
          print('Liquid Glass build: iOS SDK '+sdk)
          PYCODE
      - name: Check scanner core
        run: |
          python3 scripts/check_package.py
          swiftc AutoSplit/Rules.swift AutoSplit/RimSeal.swift tests/main.swift -o core-tests
          ./core-tests
          swiftc AutoSplit/Rules.swift AutoSplit/StudioPresentation.swift tests/StudioPresentationTests.swift -o presentation-tests
          ./presentation-tests
      - name: Check compact document direction with native Vision
        run: |
          swiftc AutoSplit/Rules.swift AutoSplit/Orientation.swift tests/VisionOrientation.swift -o vision-tests
          ./vision-tests
      - name: Verify ZIP integrity and Ukrainian filenames
        run: |
          swiftc AutoSplit/Rules.swift AutoSplit/ExportArchive.swift tests/ExportArchiveTest.swift -o archive-test
          ./archive-test "$RUNNER_TEMP/scanflow-archive"
          python3 - <<'PYCODE'
          import os, pathlib, zipfile
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'scanflow-archive' / 'Тест.zip'
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              assert z.read('Тест_ПКМУ975.pdf') == b'%PDF-fixture'
              assert z.read('Завдання.txt').decode() == 'КОМПЛЕКТ-975'
          PYCODE
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          python3 scripts/verify_icon_project.py
      - name: Build unsigned device app
        run: >-
          xcodebuild -project AutoSplit.xcodeproj -scheme AutoSplit
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Render exact icon selection previews
        run: python3 scripts/render_icon_previews.py --platform iphoneos --app build/Build/Products/Release-iphoneos/AutoSplit.app
      - name: Verify file sharing and package unsigned IPA
        run: |
          python3 - <<'PYCODE'
          import plistlib
          with open('build/Build/Products/Release-iphoneos/AutoSplit.app/Info.plist','rb') as stream:
              info = plistlib.load(stream)
          assert info['UIFileSharingEnabled'] is True
          assert info['LSSupportsOpeningDocumentsInPlace'] is True
          assert info['CFBundleIdentifier'] == 'ua.autosplit.scanner'
          assert info['CFBundleShortVersionString'] == '0.4.23'
          assert info['CFBundleVersion'] == '45'
          icons = info['CFBundleIcons']
          print('Compiled app icons:', icons)
          assert icons['CFBundlePrimaryIcon']['CFBundleIconName'] == 'ScanFlowIcon'
          assert set(icons['CFBundleAlternateIcons']) == {'ScanFlowPearl','ScanFlowGraphite','ScanFlowClassic'}
          PYCODE
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AutoSplit.app Payload/
          zip -qr ScanFlow-0.4.23.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ScanFlow-0.4.23-build45
          path: ScanFlow-0.4.23.ipa
          retention-days: 7

  preview:
    if: ${{ !contains(github.event.head_commit.message, '[package only]') }}
    name: Native home design preview
    runs-on: macos-26-intel
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode for Liquid Glass
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import glob, os, re, plistlib
          candidates=glob.glob('/Applications/Xcode*.app')
          def version(path):
              try:
                  with open(path+'/Contents/Info.plist','rb') as stream:
                      label=plistlib.load(stream).get('CFBundleShortVersionString','')
              except (OSError,ValueError):
                  label=os.path.basename(path)
              numbers=re.findall(r'\d+',label)
              return tuple(int(n) for n in numbers) if numbers else (0,)
          modern=[p for p in candidates if (26,)<=version(p)<(27,) and 'beta' not in p.lower()]
          if modern:
              chosen=max(modern,key=version)+'/Contents/Developer'
              with open(os.environ['GITHUB_ENV'],'a') as stream:
                  stream.write('DEVELOPER_DIR='+chosen+'\n')
              print('Using '+chosen)
          else:
              raise SystemExit('::error::Stable Xcode 26 is missing. Use macos-26-intel and the complete workflow from ScanFlow 0.4.2.')
          PYCODE
      - name: Generate simulator project
        run: |
          brew install xcodegen
          xcodegen generate
          python3 scripts/verify_icon_project.py
      - name: Build native simulator app
        run: |
          xcodebuild -project AutoSplit.xcodeproj -scheme AutoSplit \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath preview-build CODE_SIGNING_ALLOWED=NO ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES build > preview-build.log 2>&1 || { tail -100 preview-build.log; exit 1; }
      - name: Render exact simulator icon selection previews
        run: python3 scripts/render_icon_previews.py --platform iphonesimulator --app preview-build/Build/Products/Debug-iphonesimulator/AutoSplit.app
      - name: Capture home and large text layout
        run: python3 scripts/preview_home.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ScanFlow-0.4.23-design-preview
          path: design-preview/
          retention-days: 7
