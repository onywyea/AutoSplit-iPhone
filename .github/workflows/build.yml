name: Build ScanFlow 0.4.7 - one file
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore embedded ScanFlow 0.4.7 update
        env:
          SCANFLOW_CODE_CHUNK_000: ""
          SCANFLOW_CODE_CHUNK_001: ""
          SCANFLOW_CODE_CHUNK_002: ""
          SCANFLOW_CODE_CHUNK_003: ""
          SCANFLOW_CODE_CHUNK_004: ""
          SCANFLOW_CODE_CHUNK_005: ""
          SCANFLOW_CODE_CHUNK_006: ""
          SCANFLOW_CODE_CHUNK_007: ""
          SCANFLOW_CODE_CHUNK_008: ""
          SCANFLOW_CODE_CHUNK_009: ""
          SCANFLOW_CODE_CHUNK_010: ""
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64,hashlib,io,os,pathlib,zipfile
          parts=[os.environ[k] for k in sorted(os.environ) if k.startswith('SCANFLOW_CODE_CHUNK_')]
          payload=base64.b64decode(''.join(parts),validate=True)
          if hashlib.sha256(payload).hexdigest() != '1805f4fbc1081c4c75532a2f03cb9437e42634bc45ccab3ffd1c0851a1e3e138':
              raise SystemExit('::error::Update payload checksum mismatch; upload build.yml again.')
          root=pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              for entry in archive.infolist():
                  relative=pathlib.PurePosixPath(entry.filename)
                  allowed=(relative.parts[0] in ('AutoSplit','scripts','tests') or entry.filename=='project.yml')
                  if not allowed or relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit('::error::Unsafe update path')
                  destination=root.joinpath(*relative.parts)
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(archive.read(entry))
          if not (root/'AutoSplit/Assets.xcassets/AppIcon.appiconset/AppIcon.png').is_file():
              raise SystemExit('::error::Existing app assets are missing; use the full ScanFlow archive for a new repository.')
          print('ScanFlow 0.4.7 build 26: restored 30 source/settings/test files for this build.')
          PYCODE
      - name: Select installed Xcode for Liquid Glass
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import glob, os, re, plistlib
          candidates=glob.glob('/Applications/Xcode*.app')
          def version(path):
              try:
                  with open(path+'/Contents/Info.plist','rb') as stream:
                      label=plistlib.load(stream).get('CFBundleShortVersionString','')
              except (OSError,ValueError):
                  label=os.path.basename(path)
              numbers=re.findall(r'\d+',label)
              return tuple(int(n) for n in numbers) if numbers else (0,)
          modern=[p for p in candidates if (26,)<=version(p)<(27,) and 'beta' not in p.lower()]
          if modern:
              chosen=max(modern,key=version)+'/Contents/Developer'
              with open(os.environ['GITHUB_ENV'],'a') as stream:
                  stream.write('DEVELOPER_DIR='+chosen+'\n')
              print('Using '+chosen)
          else:
              raise SystemExit('::error::Stable Xcode 26 is missing. Use macos-26-intel and the complete workflow from ScanFlow 0.4.2.')
          PYCODE
      - name: Verify Liquid Glass SDK
        run: |
          xcodebuild -version
          python3 - <<'PYCODE'
          import subprocess
          sdk=subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-version'],text=True).strip()
          if int(sdk.split('.')[0])<26:
              raise SystemExit('::error::iOS SDK 26+ required for Liquid Glass. Update the workflow.')
          print('Liquid Glass build: iOS SDK '+sdk)
          PYCODE
      - name: Check scanner core
        run: |
          python3 scripts/check_package.py
          swiftc AutoSplit/Rules.swift tests/main.swift -o core-tests
          ./core-tests
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned device app
        run: >-
          xcodebuild -project AutoSplit.xcodeproj -scheme AutoSplit
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AutoSplit.app Payload/
          zip -qr AutoSplit-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSplit-unsigned
          path: AutoSplit-unsigned.ipa
          retention-days: 7
