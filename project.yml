name: AutoSplit
options:
  fileTypes:
    icon:
      file: true
      buildPhase: resources
  bundleIdPrefix: ua.autosplit
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  AutoSplit:
    type: application
    platform: iOS
    sources: [AutoSplit]
    info:
      path: ScanFlowInfo.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.autosplit.scanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScanFlow
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: ScanFlowIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "ScanFlowPearl ScanFlowGraphite ScanFlowClassic ScanFlowPrism ScanFlowStack ScanFlowLens ScanFlowRibbon ScanFlowPortal ScanFlowFolio ScanFlowOrbit ScanFlowWave ScanFlowArchive ScanFlowFacet ScanFlowArt201 ScanFlowArt202 ScanFlowArt203 ScanFlowArt204 ScanFlowArt205 ScanFlowArt206 ScanFlowArt207 ScanFlowArt208 ScanFlowArt209 ScanFlowArt210 ScanFlowArt301 ScanFlowArt302 ScanFlowArt303 ScanFlowArt304 ScanFlowArt305 ScanFlowArt306 ScanFlowArt307 ScanFlowArt308 ScanFlowArt309 ScanFlowArt310"
        INFOPLIST_KEY_NSCameraUsageDescription: Сканування документів у PDF
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '0.4.25'
        CURRENT_PROJECT_VERSION: 47
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
