name: AutoSplit
options:
  bundleIdPrefix: ua.autosplit
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  AutoSplit:
    type: application
    platform: iOS
    sources: [AutoSplit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.autosplit.scanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Сканування документів у PDF
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
